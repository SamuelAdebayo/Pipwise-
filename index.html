<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pipwise</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1b1b1a;--mut:#66665f;--bd:#dcdcd5;--up:#117a4d;--dn:#b3261e;--warn:#9a6700;--ac:#1f4fd8}
@media(prefers-color-scheme:dark){:root{--bg:#121211;--card:#1e1e1c;--tx:#ecece8;--mut:#9d9d95;--bd:#363630;--up:#4cc38a;--dn:#ff7b72;--warn:#e3b341;--ac:#7aa2ff}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}header small{color:var(--mut);font-size:12px}
main{max-width:640px;margin:auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom));display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;overflow-x:auto}
nav#bar{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav#bar a{flex:1;text-align:center;padding:11px 2px;color:var(--mut);text-decoration:none;font-size:13px}nav#bar a.on{color:var(--ac);font-weight:700}
select,input,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);max-width:100%}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button:disabled{opacity:.6}button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{justify-content:space-between}.mut{color:var(--mut)}.note{font-size:13px;margin-top:8px}.warn{color:var(--warn)}.err{color:var(--dn)}
.big{font-size:34px;font-weight:800;line-height:1.1;margin:4px 0}.BUY{color:var(--up)}.SELL{color:var(--dn)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);font-size:12px;font-weight:700;white-space:nowrap}.chip.ok{color:var(--up);border-color:var(--up)}.chip.warn{color:var(--warn);border-color:var(--warn)}.chip.BUY{border-color:var(--up)}.chip.SELL{border-color:var(--dn)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.kv span{display:block;font-size:12px;color:var(--mut)}.kv b{font-size:17px}
.check{margin:10px 0;padding:10px;border:1px solid var(--bd);border-radius:10px}
.seg{display:flex;gap:6px}.seg a{flex:1;text-align:center;padding:9px 4px;border:1px solid var(--bd);border-radius:10px;color:var(--tx);text-decoration:none;background:var(--card);font-size:14px}.seg a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.trow{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--bd)}.trow>b{min-width:48px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-weight:600}td:not(:first-child),th:not(:first-child){text-align:right}
label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mut)}input,select{width:100%}.row select{width:auto;flex:1}
summary{cursor:pointer;font-weight:600}p{margin:6px 0}svg text{fill:var(--mut);font-size:11px}h2{font-size:17px;margin:0 0 4px}
</style></head><body>
<header><h1>Pipwise</h1><small>Paper trading and analysis · no live orders <span id="clock"></span></small></header>
<main id="view"><div class="card mut">Loading…</div></main>
<nav id="bar"></nav>
<script>
const $=s=>document.querySelector(s);let CFG;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,o)=>{const r=await fetch(p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j};
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
let S={sym:'EUR/USD',tf:'4h'};try{Object.assign(S,JSON.parse(localStorage.getItem('pw')||'{}'))}catch(e){}
const keep=()=>{try{localStorage.setItem('pw',JSON.stringify(S))}catch(e){}};
const TFM={'15min':15,'1h':60,'4h':240},TYP={'EUR/USD':0.00008,'GBP/USD':0.0001,'USD/JPY':0.008,'GBP/JPY':0.02,'XAU/USD':0.3};
const dp=s=>s.includes('JPY')?3:s.startsWith('XAU')?2:5,f=(s,x)=>x==null?'–':Number(x).toFixed(dp(s)),n2=x=>x==null?'–':Number(x).toFixed(2),pc=x=>x==null?'–':(x*100).toFixed(0)+'%';
const R=r=>r==null?'–':(r>0?'+':'')+Number(r).toFixed(2)+'R';
const tm=t=>t?new Intl.DateTimeFormat([],{timeZone:CFG.tz,dateStyle:'medium',timeStyle:'short'}).format(t):'–';
const tmS=t=>new Intl.DateTimeFormat([],{timeZone:CFG.tz,timeStyle:'medium'}).format(t);
const opts=(a,sel)=>a.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('');
const pairSel=(tf=true)=>`<select id="sym" aria-label="Pair">${opts(CFG.instruments,S.sym)}</select>${tf?`<select id="tf" aria-label="Timeframe">${opts(CFG.timeframes,S.tf)}</select>`:''}`;
const bindSel=fn=>{$('#sym').onchange=()=>{S.sym=$('#sym').value;keep();fn()};if($('#tf'))$('#tf').onchange=()=>{S.tf=$('#tf').value;keep();fn()}};
const seg=(base,items,cur)=>`<div class="seg">${items.map(([k,l])=>`<a href="#${base}/${k}" class="${k===cur?'on':''}">${l}</a>`).join('')}</div>`;
const metricLine=m=>m.resolved?`${m.resolved} finished · win ${pc(m.winRate)} · avg ${R(m.avgR)} · profit factor ${n2(m.profitFactor)} · worst drop ${n2(m.maxDrawdownR)}R · total ${R(m.cumulativeR)}`:'No finished trades yet';
function zonedToUtc(s,tz){const m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(s);if(!m)return NaN;const g=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);
 const off=t=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(t));const q=k=>+p.find(x=>x.type===k).value;return Date.UTC(q('year'),q('month')-1,q('day'),q('hour'),q('minute'),q('second'))-t};return g-off(g-off(g))}
const nowLocal=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:CFG.tz,dateStyle:'short',timeStyle:'short'}).format(new Date()).replace(' ','T');

/* ---------- router ---------- */
const PAGES={home,trades,lab,audit,more};let page='home';
const NAV=[['home','Home'],['trades','Trades'],['lab','Lab'],['audit','Audit'],['more','More']];
async function route(){if(!CFG)return;const [p,sub]=(location.hash||'#home').slice(1).split('/');page=PAGES[p]?p:'home';
 document.querySelectorAll('#bar a').forEach(a=>a.classList.toggle('on',a.dataset.p===page));
 $('#view').innerHTML='<div class="card mut">Loading…</div>';try{await PAGES[page](sub)}catch(e){$('#view').innerHTML=`<div class="card err">${esc(e.message)}</div>`}window.scrollTo(0,0)}
async function init(){CFG=await api('/api/config');$('#bar').innerHTML=NAV.map(([k,l])=>`<a href="#${k}" data-p="${k}">${l}</a>`).join('');
 if(!CFG.instruments.includes(S.sym))S.sym=CFG.instruments[0];if(!CFG.timeframes.includes(S.tf))S.tf=CFG.timeframes[0];
 window.addEventListener('hashchange',route);setInterval(()=>{$('#clock').textContent='· '+tmS(Date.now())+' '+CFG.tz},1000);
 setInterval(()=>{if(!document.hidden&&page==='home'&&$('#sig')){loadHome(false);loadScan()}},120000);route()}

/* ---------- HOME: what is the signal right now ---------- */
async function home(){$('#view').innerHTML=`${CFG.storage&&CFG.storage.isDefault?'<div class="card"><b class="warn">Temporary storage</b><p>Your history is erased whenever the service sleeps, restarts or redeploys. Download a backup, or set up a persistent disk.</p><a href="#more/settings">Open backup and storage</a></div>':''}<div class="card"><div class="row">${pairSel()}<button id="rf">Refresh</button></div><div id="stat" style="margin-top:8px" class="mut">Loading…</div></div>
 <div class="card" id="sig"></div><div class="card" id="scan"><h2>All timeframes</h2><div class="mut">Loading…</div></div><div class="card" id="cht"></div>
 <details class="card" id="why"><summary>Why this signal? Rules and indicators</summary><div id="whyb"></div></details>`;
 bindSel(home);$('#rf').onclick=()=>{loadHome(true);loadScan()};loadHome(false);loadScan()}
async function loadHome(force){let d;try{d=await api(`/api/snapshot?symbol=${encodeURIComponent(S.sym)}&tf=${S.tf}${force?'&force=1':''}`)}catch(e){d={ok:false,error:{kind:'client',message:e.message}}}
 const b=$('#rf');if(!b||!$('#sig'))return;
 if(d.setup){$('#stat').textContent='';$('#sig').innerHTML='<h2>Setup needed</h2><p>No market-data key is set on the server, so no prices are shown. Add TWELVEDATA_API_KEY and restart.</p>';return}
 if(!d.ok){$('#stat').innerHTML=`<span class="chip warn">ERROR</span> ${esc(d.error.kind)} · checked ${tmS(Date.now())}`;$('#sig').innerHTML=`<div class="big err">No data</div><p>${esc(d.error.message)}</p><p class="mut">No prices are invented. Your saved trades are safe.</p>`;$('#cht').innerHTML='';$('#why').hidden=true;return}
 $('#why').hidden=false;
 const st=d.fromCache?['CACHED','warn',`Showing saved data (${d.cacheAgeSec}s old) because of the provider limit.`]:d.stale?['STALE','warn','The latest candle is older than expected, so no new signals are created.']:['FRESH','ok','Data is up to date.'];
 $('#stat').innerHTML=`<span class="chip ${st[1]}">${st[0]}</span> ${esc(st[2])}<br>Price now <b>${f(d.symbol,d.livePrice)}</b>${d.live?'':' (market closed, last close)'} · last candle closed ${tm(d.latestCandleT+TFM[d.tf]*60000)} · checked ${tmS(Date.now())}${d.excludedCandles?`<br><span class="warn">${d.excludedCandles} bad candle(s) from the provider were skipped.</span>`:''}`;
 const L=d.levels,failed=(d.rules||[]).filter(r=>!r.pass).map(r=>r.name),lab={BUY:'BUY ▲',SELL:'SELL ▼',WAIT:'WAIT'}[d.signal];
 $('#sig').innerHTML=`<div class="mut">${esc(d.symbol)} · ${esc(d.tf)} chart</div><div class="big ${d.signal}">${lab}</div><div>${d.signal==='WAIT'?esc(d.reason?'Not enough price history yet.':'No trade. Not met: '+failed.join('; ')):'All 4 rules pass on the latest closed candle.'}</div>`
  +(d.entryCheck?`<div class="check"><span class="chip">${esc(d.entryCheck.state)}</span> ${esc(d.entryCheck.text)}</div>`:'')
  +(L?`<div class="grid"><div class="kv"><span>Entry</span><b>${f(d.symbol,L.entry)}</b></div><div class="kv"><span>Reward : risk</span><b>${n2(L.rr)} : 1</b></div><div class="kv"><span>Stop loss</span><b>${f(d.symbol,L.stop)}</b></div><div class="kv"><span>Take profit</span><b>${f(d.symbol,L.target)}</b></div></div><div class="mut">Signal candle closed ${tm(d.latestCandleT+TFM[d.tf]*60000)}. Real fills differ (spread, slippage).</div>`:'')
  +`<div class="mut note">Experimental rules. This is not a prediction or a probability of winning.</div>`;
 const x=d.indicators||{};$('#whyb').innerHTML=`<ul>${(d.rules||[]).map(r=>`<li>${r.pass?'✔ passes':'✘ fails'}: ${esc(r.name)}</li>`).join('')}</ul><table><tr><td>EMA 20</td><td>${f(d.symbol,x.e20)}</td></tr><tr><td>EMA 50</td><td>${f(d.symbol,x.e50)}</td></tr><tr><td>EMA 200</td><td>${f(d.symbol,x.e200)}</td></tr><tr><td>RSI 14</td><td>${n2(x.rsi)}</td></tr><tr><td>ATR 14</td><td>${f(d.symbol,x.atr)}</td></tr></table><div class="mut note">Strategy ${esc(d.strategy)}</div>`;
 chart(d)}
function chart(d){const c=d.chart.slice(-90),L=d.levels,W=720,H=300,P=50;if(!c.length){$('#cht').innerHTML='';return}
 const v=c.flatMap(k=>[k.h,k.l]).concat(L?[L.stop,L.target]:[]),mx=Math.max(...v),mn=Math.min(...v),y=x=>8+(H-26)*(mx-x)/(mx-mn||1),bw=(W-P)/c.length,x=i=>i*bw+bw/2;let s='';
 for(let i=0;i<=4;i++){const p=mn+(mx-mn)*i/4;s+=`<line x1="0" x2="${W-P}" y1="${y(p)}" y2="${y(p)}" stroke="currentColor" opacity=".1"/><text x="${W-P+3}" y="${y(p)+4}">${f(d.symbol,p)}</text>`}
 c.forEach((k,i)=>{const up=k.c>=k.o,col=up?'var(--up)':'var(--dn)';s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${col}"/><rect x="${x(i)-bw*.35}" y="${y(Math.max(k.o,k.c))}" width="${bw*.7}" height="${Math.max(1,Math.abs(y(k.o)-y(k.c)))}" fill="${col}"/>`});
 [['e20','#e8a317'],['e50','#2a7de1'],['e200','#8a5cd6']].forEach(([k,col])=>{const pts=c.map((q,i)=>q[k]==null?null:`${x(i)},${y(q[k])}`).filter(Boolean).join(' ');if(pts)s+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.2"/>`});
 if(L)[['Entry',L.entry,'currentColor'],['Stop',L.stop,'var(--dn)'],['Target',L.target,'var(--up)']].forEach(([n,p,col])=>s+=`<line x1="0" x2="${W-P}" y1="${y(p)}" y2="${y(p)}" stroke="${col}" stroke-dasharray="5 4"/><text x="4" y="${y(p)-3}">${n} ${f(d.symbol,p)}</text>`);
 $('#cht').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Candlestick chart"><g>${s}</g><text x="4" y="${H-4}">EMA20 amber · EMA50 blue · EMA200 purple</text></svg>`}
async function loadScan(){let rows;try{rows=await api('/api/scan?symbol='+encodeURIComponent(S.sym))}catch(e){if($('#scan'))$('#scan').innerHTML=`<h2>All timeframes</h2><span class="err">${esc(e.message)}</span>`;return}
 const el=$('#scan');if(!el)return;if(!rows.length){el.innerHTML='';return}
 const ok=new Set();rows.forEach(r=>{if(!r.ok)return;if(r.signal!=='WAIT'&&r.entryCheck&&r.entryCheck.state==='ENTER')ok.add(`${r.tf} ${r.signal}`);(r.open||[]).forEach(o=>{if(o.check.state==='ENTER')ok.add(`${r.tf} ${o.dir}`)})});
 const dirs=new Set([...ok].map(x=>x.split(' ')[1]));
 el.innerHTML=`<h2>${esc(S.sym)}: all timeframes</h2><div>${ok.size?`Valid entries now: <b>${esc([...ok].join(', '))}</b>${ok.size>1&&dirs.size===1?'. They point the same way, but they are one idea seen at different zoom levels, not extra proof.':dirs.size>1?'. The timeframes disagree.':''}`:'No valid entry right now on any timeframe.'}</div>`
 +rows.map(r=>!r.ok?`<div class="trow"><b>${r.tf}</b><span class="err">${esc(r.error.message)}</span></div>`:`<div class="trow"><b>${r.tf}</b><span class="chip ${r.signal}">${r.signal}</span><span>${r.open.length?r.open.map(o=>`${o.dir} from ${tm(o.signalT)}: <b>${esc(o.check.state)}</b>`).join('<br>'):r.signal!=='WAIT'&&r.entryCheck?`<b>${esc(r.entryCheck.state)}</b>`:'<span class="mut">no setup</span>'}</span></div>`).join('')
 +'<div class="mut note">ENTER means price is still close enough to the original entry. It does not mean the trade will win.</div>'}

/* ---------- TRADES: open, closed, all ---------- */
const resText=s=>({open:'OPEN',target:'WIN '+R(s.r),stop:'LOSS '+R(s.r),ambiguous:'UNCLEAR (stop and target in one candle)',expired:'EXPIRED',unverified:'NOT VERIFIABLE',untrackable:'TOO OLD TO CHECK'}[s.status]||s.status);
const tradeCard=s=>`<div class="card"><div class="row sp"><b class="${s.dir}">${s.dir==='BUY'?'BUY ▲':'SELL ▼'}</b><span>${esc(s.symbol)} · ${esc(s.tf||'')}</span><span class="chip">${esc(resText(s))}</span></div>
 <div class="grid3"><div class="kv"><span>Entry</span><b>${f(s.symbol,s.entry)}</b></div><div class="kv"><span>Stop</span><b>${f(s.symbol,s.stop)}</b></div><div class="kv"><span>Target</span><b>${f(s.symbol,s.target)}</b></div></div>
 <div class="mut">Signal time ${tm(s.tf?s.candle_t+TFM[s.tf]*60000:s.signal_t)}${s.resolved_t&&s.status!=='open'&&s.tf?` · closed ${tm(s.resolved_t+TFM[s.tf]*60000)}`:''}</div>${s.check?`<div class="check"><span class="chip">${esc(s.check.state)}</span> ${esc(s.check.text)}</div>`:''}</div>`;
async function trades(sub){sub=['open','closed','all'].includes(sub)?sub:'open';const rows=await api('/api/signals'+(sub==='all'?'':'?status='+sub));let head='';
 if(sub==='closed'){const done=rows.filter(s=>s.r!=null),t=done.reduce((a,s)=>a+s.r,0);head=`<div class="card"><b>${done.length} finished trades · total ${R(t)}</b><div class="mut note">R = profit measured in units of the planned risk. Before spread. Unclear and expired trades are not counted.</div></div>`}
 $('#view').innerHTML=seg('trades',[['open','Open'],['closed','Closed'],['all','All']],sub)+head+(rows.map(tradeCard).join('')||'<div class="card mut">Nothing here yet. Signals are recorded automatically when all the rules are met.</div>')}

/* ---------- LAB: do the filters really help? ---------- */
let PAIR_WAIT=30000;const LAB_PAIRS=['EUR/USD','GBP/USD','USD/JPY'],sleep=ms=>new Promise(r=>setTimeout(r,ms));
const labRow=(l,a,b)=>`<tr><td>${l}</td><td>${a}</td><td>${b}</td></tr>`;
function labHtml(r){const d=r.dataset,col=x=>x.net;
 return `<div class="card"><b>${esc(d.symbol)} ${esc(d.tf)}</b><div class="mut note">${d.candles} candles from ${tm(d.first)} to ${tm(d.last)}${d.higherTimeframe?`; trend filter uses ${esc(d.higherTimeframe)} candles`:''}${d.excludedCandles?`; ${d.excludedCandles} bad candle(s) skipped`:''}. Spread ${esc(r.spread)} and slippage ${esc(r.slippagePips)} pips (${esc(r.slippage)} price units). Results are after both costs.</div><div class="note"><b>How to read it:</b> look at average R per trade. A filter only counts if it beats the plain rules in both periods and each period has at least 30 trades.</div></div>`
 +r.results.map(x=>x.unavailable?`<div class="card"><b>${esc(x.name)}</b><p class="mut">${esc(x.unavailable)}.</p></div>`
  :`<div class="card"><div class="row sp"><b>${esc(x.name)}</b><span class="chip ${/Better/.test(x.verdict)?'ok':'warn'}">${esc(x.verdict)}</span></div><table><tr><th></th><th>Development</th><th>Out-of-sample</th></tr>`
   +labRow('Finished trades',col(x.development).resolved,col(x.outOfSample).resolved)+labRow('Win rate',pc(col(x.development).winRate),pc(col(x.outOfSample).winRate))
   +labRow('Avg R per trade',R(col(x.development).avgR),R(col(x.outOfSample).avgR))+labRow('Profit factor',n2(col(x.development).profitFactor),n2(col(x.outOfSample).profitFactor))
   +labRow('Worst drop',n2(col(x.development).maxDrawdownR)+'R',n2(col(x.outOfSample).maxDrawdownR)+'R')+labRow('Total',R(col(x.development).cumulativeR),R(col(x.outOfSample).cumulativeR))+'</table></div>').join('')
 +`<div class="card mut note">${esc(r.assumptions)} Out-of-sample means the last 30% of the history, which was not used to choose the filters. If you keep trying variations until one looks good, it will probably be luck.</div>`}
async function lab(){$('#view').innerHTML=`<div class="card"><h2>Filter Lab</h2><p class="mut">Runs the same real price history through the plain rules and then through each filter, so you can see whether a filter truly helps. Costs are included.</p><div class="row">${pairSel()}</div>
 <label for="sp">Spread in price units (rough typical value, replace it with your broker's)</label><input id="sp" type="number" step="any" min="0" value="${TYP[S.sym]}">
 <label for="sl">Slippage in pips (extra cost of a worse fill, charged like the spread)</label><input id="sl" type="number" step="any" min="0" max="50" value="0.5">
 <div class="row" style="margin-top:10px"><button id="go">Run comparison</button><button id="all" class="ghost">Run all pairs</button></div>
 <div class="mut note">Run all pairs tests EUR/USD, GBP/USD and USD/JPY on the selected timeframe, one at a time, using typical spreads for each pair and the slippage above. It waits between pairs to stay inside the data provider's free limit, so it takes a couple of minutes.</div><div id="prog" class="note"></div></div><div id="out"></div>`;
 bindSel(lab);const busy=b=>{['#go','#all'].forEach(s=>{const e=$(s);if(e)e.disabled=b})},prog=t=>{const e=$('#prog');if(e)e.textContent=t};
 $('#go').onclick=async()=>{const out=$('#out');out.innerHTML='<div class="card mut">Running. This downloads up to 5,000 candles, so it can take a few seconds…</div>';busy(true);
  try{const r=await post('/api/lab',{symbol:S.sym,tf:S.tf,spread:$('#sp').value,slippagePips:$('#sl').value});if($('#out'))$('#out').innerHTML=labHtml(r)}catch(e){if($('#out'))$('#out').innerHTML=`<div class="card err">${esc(e.message)}</div>`}busy(false)};
 $('#all').onclick=async()=>{busy(true);let html='';if($('#out'))$('#out').innerHTML='';const sl=$('#sl').value;
  for(let i=0;i<LAB_PAIRS.length;i++){const sy=LAB_PAIRS[i];if(!$('#out'))return;
   if(i>0)for(let s=Math.ceil(PAIR_WAIT/1000);s>0;s--){prog(`Waiting ${s}s before ${sy}, to respect the data provider's free limit…`);await sleep(Math.min(1000,PAIR_WAIT))}
   prog(`Running ${sy} (${i+1} of ${LAB_PAIRS.length})…`);
   try{const r=await post('/api/lab',{symbol:sy,tf:S.tf,spread:TYP[sy],slippagePips:sl});html+=`<h2 style="margin:6px 2px">${esc(sy)}</h2>`+labHtml(r)}
   catch(e){const lim=/rate limit/i.test(e.message);html+=`<div class="card err"><b>${esc(sy)}: ${lim?'Rate limit reached':'Could not run'}</b><p>${esc(e.message)}</p>${lim?'<p>The data provider\'s free limit was hit, so the run stopped here. Wait about a minute, then tap Run all pairs again. Pairs that finished are kept above.</p>':''}</div>`;if($('#out'))$('#out').innerHTML=html;if(lim)break}
   if($('#out'))$('#out').innerHTML=html}
  prog('');busy(false)}}

/* ---------- AUDIT: check any outside provider's claims ---------- */
async function audit(){const list=await api('/api/audit');
 const form=`<div class="card"><h2>Signal Audit</h2><p class="mut">Type in signals from any app, channel or person. Pipwise checks them against real prices and shows the true results, next to Pipwise's own.</p>
 <details${list.length?'':' open'}><summary>Add a signal</summary><label for="au-src">Source name</label><input id="au-src" maxlength="40" placeholder="e.g. Channel A">
 <label for="au-sym">Pair</label><select id="au-sym">${opts(CFG.instruments,S.sym)}</select><label for="au-dir">Direction</label><select id="au-dir"><option>BUY</option><option>SELL</option></select>
 <label for="au-en">Entry price</label><input id="au-en" type="number" step="any"><label for="au-st">Stop loss</label><input id="au-st" type="number" step="any"><label for="au-tp">Take profit</label><input id="au-tp" type="number" step="any">
 <label for="au-t">When the signal was given (${esc(CFG.tz)} time, within the last 14 days)</label><input id="au-t" type="datetime-local" value="${nowLocal()}"><div style="margin-top:10px"><button id="au-add">Add signal</button></div><p id="au-msg" class="err"></p></details></div>`;
 $('#view').innerHTML=form+(list.length?list.map(s=>{const m=s.metrics,p=s.pipwise;return `<div class="card"><div class="row sp"><h2>${esc(s.source)}</h2><span class="chip">${s.signals} signals</span></div>
  <div><b>Their results</b><div>${metricLine(m)}</div></div><div style="margin-top:8px"><b>Pipwise, same period</b><div>${p.metrics.resolved?metricLine(p.metrics):'No finished Pipwise trades in this period yet'}</div></div>
  <div class="mut note">Still open: ${s.open} · unclear: ${s.ambiguous} · expired: ${s.expired} · could not verify: ${s.unverified}. Assumes the stated entry was filled. Only finished trades are scored.</div>
  <details><summary>Their signals</summary>${s.list.map(a=>tradeCard(a)+`<button class="ghost" data-del="${a.id}" style="margin-bottom:8px">Delete this signal</button>`).join('')}</details></div>`}).join(''):'<div class="card mut">No signals added yet.</div>');
 $('#au-add').onclick=async()=>{const m=$('#au-msg');m.textContent='';try{await post('/api/audit',{source:$('#au-src').value,symbol:$('#au-sym').value,dir:$('#au-dir').value,entry:$('#au-en').value,stop:$('#au-st').value,target:$('#au-tp').value,signal_t:zonedToUtc($('#au-t').value,CFG.tz)});audit()}catch(e){m.textContent=e.message}};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await post('/api/audit/delete',{id:b.dataset.del});audit()})}

/* ---------- MORE: performance, alerts, settings ---------- */
async function more(sub){sub=['performance','alerts','settings'].includes(sub)?sub:'performance';let body='';
 if(sub==='performance'){const p=await api('/api/performance'),grp=(t,o)=>Object.entries(o).map(([k,v])=>`<div class="card"><b>${t}: ${esc(k)}</b><div>${metricLine(v.gross)}</div><div class="mut note">Open ${v.open} · unclear ${v.ambiguous} · expired ${v.expired}</div></div>`).join('');
  body=`<div class="card"><b>All Pipwise signals</b><div>${metricLine(p.overall.gross)}</div><div class="mut note">${esc(p.note)}</div></div>`+grp('Pair',p.bySymbol)+grp('Timeframe',p.byTimeframe)+grp('Strategy',p.byStrategy)
   +`<details class="card"><summary>What the numbers mean</summary><ul><li>R: profit in units of the planned risk. A stop is -1R, a 2:1 target is +2R.</li><li>Win rate: wins divided by finished trades.</li><li>Avg R: average result per finished trade (the expectancy).</li><li>Profit factor: total won R divided by total lost R.</li><li>Worst drop: biggest fall from a peak of total R.</li></ul></details>`}
 else if(sub==='alerts'){const a=await api('/api/alerts');body=`<div class="card"><button id="rd" class="ghost">Mark all read</button></div>`+(a.map(x=>`<div class="card"><div class="row sp"><span class="chip">${esc(x.type)}${x.read?'':' · new'}</span><span class="mut">${tm(x.created_at)}</span></div><div>${esc(x.message)}</div></div>`).join('')||'<div class="card mut">No alerts yet.</div>')}
 else{const p=CFG.params,t=CFG.telegram;body=`<div class="card"><h2>Strategy</h2><p class="mut">Changes apply to new signals under a new version name. Saved signals are never rewritten.</p><label>RSI range for BUY</label><div class="row"><input id="a1" value="${p.rsiBull[0]}"><input id="a2" value="${p.rsiBull[1]}"></div><label>RSI range for SELL</label><div class="row"><input id="b1" value="${p.rsiBear[0]}"><input id="b2" value="${p.rsiBear[1]}"></div>
  <label>Stop distance (times ATR)</label><input id="at" value="${p.atrStop}"><label>Target (times the risk)</label><input id="rr" value="${p.rr}"><label>Timezone</label><input id="tz" value="${esc(CFG.tz)}"><div style="margin-top:10px"><button id="sv">Save</button></div><p id="sm" class="mut">Current: ${esc(p.version)}</p></div>
  <div class="card"><h2>Storage and backup</h2><p>Database: <b>${esc(CFG.storage.path||'unknown')}</b>, created ${tm(CFG.storage.createdAt)}.</p>${CFG.storage.isDefault?'<p class="warn">This is temporary storage. Records disappear when the host sleeps or restarts. Download a backup often, or attach a persistent disk and set DB_PATH.</p>':'<p class="mut">Stored on the path you configured. Make sure it is on a persistent disk.</p>'}
  <div class="row"><a href="/api/export" download="pipwise-backup.json"><button class="ghost" type="button">Download backup</button></a></div><label for="rs-file">Restore from a backup file (adds missing records, never deletes)</label><input id="rs-file" type="file" accept="application/json,.json"><div style="margin-top:8px"><button id="rs" class="ghost">Restore</button></div><p id="rs-msg" class="mut"></p></div>
  <div class="card"><h2>Telegram alerts</h2><p class="mut">${t.token&&t.chat?'On':t.token?'Token set, chat ID missing':'Not set up'}. The keys are set on the server.</p><div class="row"><button id="tgf" class="ghost">Find my chat ID</button><button id="tgt" class="ghost">Send test message</button></div><p id="tgm" class="mut"></p></div>`}
 $('#view').innerHTML=seg('more',[['performance','Performance'],['alerts','Alerts'],['settings','Settings']],sub)+body;
 if(sub==='alerts')$('#rd').onclick=async()=>{await post('/api/alerts/read');more('alerts')};
 if(sub==='settings'){const tgc=async(u,o,ok)=>{try{const r=await api(u,o);$('#tgm').textContent=ok(r)}catch(e){$('#tgm').textContent=e.message}};
  $('#tgf').onclick=()=>tgc('/api/telegram/chat-id',undefined,r=>'Your chat ID: '+r.chatId+'. Set it as TELEGRAM_CHAT_ID on the server.');$('#tgt').onclick=()=>tgc('/api/telegram/test',{method:'POST'},()=>'Test message sent. Check Telegram.');
  $('#rs').onclick=async()=>{const m=$('#rs-msg'),fl=$('#rs-file').files&&$('#rs-file').files[0];if(!fl){m.textContent='Choose a backup file first.';return}try{const r=await api('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:await fl.text()});m.textContent='Restored. Added: '+Object.entries(r.added).map(([k,v])=>k+' '+v).join(', ')}catch(e){m.textContent=e.message}};
  $('#sv').onclick=async()=>{try{const r=await post('/api/settings',{tz:$('#tz').value,params:{rsiBull:[$('#a1').value,$('#a2').value],rsiBear:[$('#b1').value,$('#b2').value],atrStop:$('#at').value,rr:$('#rr').value}});CFG.params=r.params;CFG.tz=r.tz;$('#sm').textContent='Saved: '+r.params.version}catch(e){$('#sm').textContent=e.message}}}}
init().catch(e=>{$('#view').innerHTML=`<div class="card err">${esc(e.message)}</div>`});
</script></body></html>
